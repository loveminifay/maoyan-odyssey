name: Odyssey Radar

on:
  workflow_dispatch:

  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 运行监控程序
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: |
          python radar.py

      - name: 保存已发现的场次
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add seen_showtimes.json

          git diff --cached --quiet || git commit -m "更新已发现的场次"

          git push
