name: 猫眼开票监控

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install requests

      - name: 运行监控程序
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: python radar.py

      - name: 保存已发现的场次
        run: |
          git config user.name "monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json
          git diff --quiet && git diff --staged --quiet || git commit -m "update seen.json"
          git push
